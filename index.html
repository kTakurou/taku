    <h1>たくろうのホームページ</h1>
    <h2>自己紹介</h2>
    <p id="age"></p>
    <script>
        const birthday = new Date(2004, 11, 13); 
        const today = new Date();
        let age = today.getFullYear() - birthday.getFullYear();
        const thisYearBirthday = new Date(
            today.getFullYear(),
            birthday.getMonth(),
            birthday.getDate()
        );
        if (today < thisYearBirthday) {
            age--;
        }
        document.getElementById("age").innerHTML =`初めまして。たくろうです。2004年生まれの${age}歳です。年齢や内容に関係なくメッセージなどいただけると嬉しいです。<br>*初めてwebページを作りました。まだ試作状態なので不都合等ありましたら連絡お願いします。`;
    </script>
